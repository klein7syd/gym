name: REPS

options:
  bundleIdPrefix: com.klein7syd
  # 钉死工程格式：XcodeGen 默认 xcode16_0（objectVersion 77），
  # macOS-14 runner 上的 Xcode 15.4 打不开，会报 "future Xcode project file format (77)"
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  REPS:
    type: application
    platform: iOS

    sources:
      # SwiftUI 源码 + Assets.xcassets + Resources/moves.json
      # Info.plist 由 INFOPLIST_FILE 单独指定，不能进 sources
      - path: REPS
        excludes:
          - "Info.plist"

    settings:
      base:
        PRODUCT_NAME: REPS
        PRODUCT_BUNDLE_IDENTIFIER: com.klein7syd.reps
        INFOPLIST_FILE: REPS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        MARKETING_VERSION: "4.4.0"
        CURRENT_PROJECT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        SWIFT_EMIT_LOC_STRINGS: NO

    scheme:
      testTargets: []
      gatherCoverageData: false
      management:
        shared: true      # 必须是共享 scheme，xcodebuild -scheme 才找得到
        isShown: true
