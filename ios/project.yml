name: REPS

options:
  bundleIdPrefix: com.klein7syd
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  REPS:
    type: application
    platform: iOS

    sources:
      # 源码 + Assets.xcassets（Info.plist 单独指定，Web 单独作为文件夹引用）
      - path: REPS
        excludes:
          - "Info.plist"
          - "Web"
      # 网页资源整体作为「文件夹引用」拷进 bundle，保留 data/ fonts/ 子目录结构
      - path: REPS/Web
        type: folder

    settings:
      base:
        PRODUCT_NAME: REPS
        PRODUCT_BUNDLE_IDENTIFIER: com.klein7syd.reps
        INFOPLIST_FILE: REPS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        SWIFT_EMIT_LOC_STRINGS: NO

    scheme:
      testTargets: []
      gatherCoverageData: false
      management:
        shared: true      # 必须是共享 scheme，xcodebuild -scheme 才找得到
        isShown: true
