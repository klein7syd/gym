name: Build iOS IPA

# REPS 2.0 —— 纯 SwiftUI 原生 App（不再是网页壳）。
# 本机是 Windows，借 GitHub 的 macOS 编译，产出未签名 IPA，
# 下载后用 Sideloadly / AltStore 自己签名装到 iPhone。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "ios/**"
      - "reps-data/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    name: 编译并打包未签名 IPA
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 同步动作库资源
        run: |
          set -euo pipefail
          mkdir -p ios/REPS/Resources
          cp reps-data/moves.json ios/REPS/Resources/moves.json
          echo "--- Swift 源码 ---"
          ls -la ios/REPS/*.swift
          echo "--- 资源 ---"
          ls -la ios/REPS/Resources/
          python3 -c "import json;d=json.load(open('ios/REPS/Resources/moves.json'));print('动作数:',len(d['moves']))"

      - name: 生成 1024 图标
        run: |
          set -euo pipefail
          ICON_DIR=ios/REPS/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICON_DIR"
          sips -z 1024 1024 fitness-app/icon-512.png --out "$ICON_DIR/icon-1024.png"
          file "$ICON_DIR/icon-1024.png"

      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate
          ls -la

      - name: 编译（不签名）
        run: |
          set -euo pipefail
          cd ios
          # 先按 scheme 编；scheme 万一没生成出来，就退回按 target 编
          xcodebuild -project REPS.xcodeproj -scheme REPS -configuration Release \
                     -sdk iphoneos -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" ENABLE_BITCODE=NO build \
            || xcodebuild -project REPS.xcodeproj -target REPS -configuration Release \
                          -sdk iphoneos \
                          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
                          CODE_SIGN_IDENTITY="" ENABLE_BITCODE=NO build

      - name: 打包成 IPA
        run: |
          set -euo pipefail
          APP="$(find ios/build -maxdepth 4 -type d -name 'REPS.app' | head -n1)"
          echo "APP = $APP"
          test -n "$APP"
          echo "--- bundle 内容 ---"
          ls -la "$APP" | head -30
          test -f "$APP/moves.json" && echo "动作库已打包" || echo "警告：moves.json 不在 bundle 根目录"
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "$GITHUB_WORKSPACE/REPS-unsigned.ipa" Payload
          cd ..
          ls -lh REPS-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: REPS-unsigned-ipa
          path: REPS-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
